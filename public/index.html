<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE RIFT</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #08080c;
            color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        button,
        input {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .screen {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .hidden {
            display: none !important;
        }

        .container {
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
        }

        /* MAIN */

        .main-content {
            text-align: center;
        }

        .title {
            font-size: 64px;
            letter-spacing: 12px;
            margin: 0 0 16px;
        }

        .subtitle {
            color: #888;
            letter-spacing: 4px;
            margin-bottom: 50px;
        }

        .portal {
            width: 260px;
            height: 260px;
            margin: 0 auto 55px;
            border: 2px solid #777;
            border-radius: 50%;
            position: relative;
            animation: pulse 3s infinite;
            box-shadow:
                0 0 30px rgba(255,255,255,.12),
                inset 0 0 30px rgba(255,255,255,.08);
        }

        .portal::before,
        .portal::after {
            content: "";
            position: absolute;
            inset: 25px;
            border: 1px solid #555;
            border-radius: 50%;
            animation: rotate 8s linear infinite;
        }

        .portal::after {
            inset: 55px;
            animation-direction: reverse;
            animation-duration: 5s;
        }

        @keyframes pulse {
            50% {
                transform: scale(1.04);
                box-shadow:
                    0 0 60px rgba(255,255,255,.2),
                    inset 0 0 40px rgba(255,255,255,.12);
            }
        }

        @keyframes rotate {
            from {
                transform: rotate(0);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .menu-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .btn {
            border: 1px solid #555;
            background: #111118;
            color: #fff;
            padding: 14px 28px;
            border-radius: 6px;
            transition: .2s;
        }

        .btn:hover {
            background: #202028;
            border-color: #aaa;
        }

        .btn-primary {
            background: #e8e8e8;
            color: #111;
            border-color: #e8e8e8;
        }

        .btn-primary:hover {
            background: #fff;
        }

        .btn-danger {
            border-color: #744;
        }

        /* LOGIN */

        .panel {
            background: #101016;
            border: 1px solid #292932;
            border-radius: 10px;
            padding: 30px;
        }

        .panel h2 {
            margin-top: 0;
        }

        .input {
            width: 100%;
            padding: 13px;
            margin-bottom: 12px;
            background: #08080c;
            border: 1px solid #333;
            border-radius: 5px;
            color: #fff;
            outline: none;
        }

        .input:focus {
            border-color: #888;
        }

        .login-buttons {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        .login-buttons .btn {
            flex: 1;
        }

        .message {
            min-height: 22px;
            color: #aaa;
            margin: 15px 0;
            font-size: 14px;
        }

        /* GAME */

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .game-title {
            letter-spacing: 4px;
            font-size: 22px;
        }

        .timer {
            font-family: monospace;
            font-size: 20px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .stat {
            background: #101016;
            border: 1px solid #292932;
            padding: 13px;
            text-align: center;
            border-radius: 6px;
        }

        .stat-label {
            color: #777;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 20px;
        }

        .room {
            background: #101016;
            border: 1px solid #292932;
            border-radius: 10px;
            padding: 30px;
            min-height: 320px;
        }

        .room-number {
            color: #777;
            font-size: 13px;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        .room-title {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .room-description {
            color: #999;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .choice-list {
            display: grid;
            gap: 10px;
        }

        .choice {
            text-align: left;
            padding: 17px;
            background: #15151d;
            border: 1px solid #333;
            color: #eee;
            border-radius: 6px;
        }

        .choice:hover {
            background: #20202a;
            border-color: #777;
        }

        .combat-enemy {
            border: 1px solid #333;
            background: #0b0b10;
            padding: 18px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .enemy-name {
            font-size: 21px;
            margin-bottom: 8px;
        }

        .enemy-hp {
            color: #bbb;
        }

        .combat-actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .combat-log {
            height: 100px;
            overflow-y: auto;
            margin-top: 15px;
            padding: 10px;
            background: #09090d;
            border: 1px solid #222;
            color: #999;
            font-size: 13px;
            line-height: 1.6;
        }

        /* RANKING */

        .ranking-list {
            margin-top: 20px;
        }

        .ranking-row {
            display: grid;
            grid-template-columns: 55px 1fr 120px;
            padding: 14px;
            border-bottom: 1px solid #25252c;
        }

        .ranking-row:first-child {
            border-top: 1px solid #25252c;
        }

        .ranking-time {
            text-align: right;
            font-family: monospace;
        }

        .clear-time {
            font-size: 38px;
            font-family: monospace;
            margin: 30px 0;
        }

        .record {
            color: #fff;
            border: 1px solid #777;
            padding: 10px;
            display: inline-block;
            border-radius: 5px;
            margin-bottom: 25px;
        }

        @media (max-width: 600px) {
            .title {
                font-size: 42px;
                letter-spacing: 7px;
            }

            .portal {
                width: 210px;
                height: 210px;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .combat-actions {
                grid-template-columns: 1fr;
            }

            .menu-buttons {
                flex-direction: column;
            }

            .login-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <!-- MAIN -->
    <section id="mainScreen" class="screen">
        <div class="container main-content">

            <h1 class="title">THE RIFT</h1>
            <div class="subtitle">ENTER THE UNKNOWN</div>

            <div class="portal"></div>

            <div class="menu-buttons">
                <button class="btn btn-primary" onclick="openGame()">
                    균열 진입
                </button>

                <button class="btn" onclick="openRanking()">
                    랭킹
                </button>

                <button id="loginMenuButton" class="btn" onclick="openLogin()">
                    로그인
                </button>
            </div>

            <div id="userStatus" style="margin-top:20px;color:#777;"></div>

        </div>
    </section>


    <!-- LOGIN -->
    <section id="loginScreen" class="screen hidden">
        <div class="container">

            <div class="panel">

                <h2>THE RIFT</h2>
                <p style="color:#777;">
                    로그인 또는 계정을 생성하세요.
                </p>

                <input
                    id="username"
                    class="input"
                    type="text"
                    placeholder="아이디"
                    maxlength="30"
                >

                <input
                    id="password"
                    class="input"
                    type="password"
                    placeholder="비밀번호"
                    maxlength="100"
                >

                <div id="loginMessage" class="message"></div>

                <div class="login-buttons">
                    <button class="btn btn-primary" onclick="login()">
                        로그인
                    </button>

                    <button class="btn" onclick="register()">
                        회원가입
                    </button>
                </div>

                <button
                    class="btn"
                    style="width:100%;margin-top:10px;"
                    onclick="showScreen('mainScreen')"
                >
                    돌아가기
                </button>

            </div>

        </div>
    </section>


    <!-- GAME -->
    <section id="gameScreen" class="screen hidden">
        <div class="container">

            <div class="game-header">
                <div class="game-title">RIFT-001</div>
                <div id="timer" class="timer">00:00.000</div>
            </div>

            <div class="stats">

                <div class="stat">
                    <div class="stat-label">HP</div>
                    <div id="playerHp" class="stat-value">100</div>
                </div>

                <div class="stat">
                    <div class="stat-label">ATK</div>
                    <div id="playerAttack" class="stat-value">10</div>
                </div>

                <div class="stat">
                    <div class="stat-label">DEF</div>
                    <div id="playerDefense" class="stat-value">3</div>
                </div>

                <div class="stat">
                    <div class="stat-label">ROOM</div>
                    <div id="roomNumber" class="stat-value">1 / 5</div>
                </div>

            </div>

            <div id="room" class="room"></div>

        </div>
    </section>


    <!-- RANKING -->
    <section id="rankingScreen" class="screen hidden">
        <div class="container">

            <div class="panel">

                <h2>RANKING</h2>

                <div style="color:#777;">
                    RIFT-001 / PERSONAL BEST
                </div>

                <div id="rankingList" class="ranking-list">
                    불러오는 중...
                </div>

                <button
                    class="btn"
                    style="width:100%;margin-top:25px;"
                    onclick="showScreen('mainScreen')"
                >
                    돌아가기
                </button>

            </div>

        </div>
    </section>


    <!-- CLEAR -->
    <section id="clearScreen" class="screen hidden">
        <div class="container">

            <div class="panel" style="text-align:center;">

                <div style="color:#777;letter-spacing:3px;">
                    RIFT CLEARED
                </div>

                <h1>균열을 돌파했다.</h1>

                <div id="clearTime" class="clear-time">
                    00:00.000
                </div>

                <div id="recordMessage" class="record hidden">
                    NEW RECORD
                </div>

                <div>
                    <button
                        class="btn btn-primary"
                        onclick="startGame()"
                    >
                        다시 도전
                    </button>

                    <button
                        class="btn"
                        onclick="openRanking()"
                    >
                        랭킹
                    </button>

                    <button
                        class="btn"
                        onclick="showScreen('mainScreen')"
                    >
                        메인
                    </button>
                </div>

            </div>

        </div>
    </section>


<script>

    /* ==========================================
       CONFIG
    ========================================== */

    var API_BASE = 'https://the-rift-api.onrender.com';


    /* ==========================================
       STATE
    ========================================== */

    var token = localStorage.getItem('rift_token');
    var currentUser = null;

    var game = {
        room: 1,
        hp: 100,
        maxHp: 100,
        attack: 10,
        defense: 3,
        startTime: null,
        serverStartTime: null,
        timerInterval: null,
        enemy: null,
        turn: 0,
        heavyCooldown: 0,
        defending: false,
        actionLocked: false
    };


    var monsters = [
        {
            name: '균열의 쥐',
            hp: 20,
            attack: 5
        },
        {
            name: '공허의 망령',
            hp: 30,
            attack: 7
        },
        {
            name: '균열의 기사',
            hp: 40,
            attack: 9
        },
        {
            name: '뒤틀린 골렘',
            hp: 55,
            attack: 11
        },
        {
            name: '심연의 사냥개',
            hp: 35,
            attack: 13
        }
    ];


    /* ==========================================
       SCREEN
    ========================================== */

    function showScreen(id) {

        var screens = document.querySelectorAll('.screen');

        screens.forEach(function(screen) {
            screen.classList.add('hidden');
        });

        document.getElementById(id).classList.remove('hidden');
    }


    /* ==========================================
       API
    ========================================== */

    async function api(url, options) {

        options = options || {};

        options.headers = options.headers || {};

        options.headers['Content-Type'] = 'application/json';

        if (token) {
            options.headers['Authorization'] = 'Bearer ' + token;
        }

        var response = await fetch(API_BASE + url, options);

        var data = await response.json();

        if (!response.ok) {
            throw new Error(data.message || 'API 요청에 실패했습니다.');
        }

        return data;
    }


    /* ==========================================
       AUTH
    ========================================== */

    async function register() {

        var username = document.getElementById('username').value.trim();
        var password = document.getElementById('password').value;

        var message = document.getElementById('loginMessage');

        if (!username || !password) {
            message.textContent = '아이디와 비밀번호를 입력해주세요.';
            return;
        }

        try {

            var data = await api('/api/auth/register', {
                method: 'POST',
                body: JSON.stringify({
                    username: username,
                    password: password
                })
            });

            token = data.token;

            localStorage.setItem('rift_token', token);

            currentUser = data.user;

            updateUserStatus();

            message.textContent = '회원가입 완료';

            setTimeout(function() {
                openGame();
            }, 500);

        } catch (error) {

            message.textContent = error.message;

        }
    }


    async function login() {

        var username = document.getElementById('username').value.trim();
        var password = document.getElementById('password').value;

        var message = document.getElementById('loginMessage');

        if (!username || !password) {
            message.textContent = '아이디와 비밀번호를 입력해주세요.';
            return;
        }

        try {

            var data = await api('/api/auth/login', {
                method: 'POST',
                body: JSON.stringify({
                    username: username,
                    password: password
                })
            });

            token = data.token;

            localStorage.setItem('rift_token', token);

            currentUser = data.user;

            updateUserStatus();

            message.textContent = '로그인 성공';

            setTimeout(function() {
                openGame();
            }, 300);

        } catch (error) {

            message.textContent = error.message;

        }
    }


    async function loadMe() {

        if (!token) {
            updateUserStatus();
            return;
        }

        try {

            var data = await api('/api/auth/me');

            currentUser = data.user;

        } catch (error) {

            token = null;
            currentUser = null;

            localStorage.removeItem('rift_token');
        }

        updateUserStatus();
    }


    function logout() {

        token = null;
        currentUser = null;

        localStorage.removeItem('rift_token');

        updateUserStatus();

        showScreen('mainScreen');
    }


    function updateUserStatus() {

        var status = document.getElementById('userStatus');
        var button = document.getElementById('loginMenuButton');

        if (currentUser) {

            status.innerHTML =
                currentUser.username + ' 님 로그인 중 ' +
                '<button class="btn" style="padding:5px 10px;margin-left:8px;" onclick="logout()">로그아웃</button>';

            button.textContent = '게임 시작';

        } else {

            status.textContent = '로그인이 필요합니다.';
            button.textContent = '로그인';
        }
    }


    function openLogin() {

        document.getElementById('loginMessage').textContent = '';

        showScreen('loginScreen');
    }


    /* ==========================================
       GAME ENTRY
    ========================================== */

    function openGame() {

        if (!token || !currentUser) {

            openLogin();

            return;
        }

        startGame();
    }


    async function startGame() {

        try {

            var data = await api('/api/rift/start', {
                method: 'POST',
                body: JSON.stringify({})
            });

            game.room = 1;
            game.hp = 100;
            game.maxHp = 100;
            game.attack = 10;
            game.defense = 3;
            game.enemy = null;
            game.turn = 0;
            game.heavyCooldown = 0;
            game.defending = false;
            game.actionLocked = false;

            game.serverStartTime = data.startTime;
            game.startTime = Date.now();

            startTimer();

            showScreen('gameScreen');

            renderRoom();

        } catch (error) {

            alert(error.message);

            if (error.message.indexOf('로그인') >= 0) {
                openLogin();
            }
        }
    }


    function startTimer() {

        if (game.timerInterval) {
            clearInterval(game.timerInterval);
        }

        game.timerInterval = setInterval(function() {

            var elapsed = Date.now() - game.startTime;

            document.getElementById('timer').textContent =
                formatTime(elapsed);

        }, 50);
    }


    function stopTimer() {

        if (game.timerInterval) {
            clearInterval(game.timerInterval);
            game.timerInterval = null;
        }
    }


    /* ==========================================
       ROOM
    ========================================== */

    function renderRoom() {

        document.getElementById('roomNumber').textContent =
            game.room + ' / 5';

        if (game.room === 5) {

            startBoss();

            return;
        }

        var roll = Math.floor(Math.random() * 3);

        if (roll === 0) {
            renderBattleRoom();
        } else if (roll === 1) {
            renderTreasureRoom();
        } else {
            renderEventRoom();
        }
    }


    function renderBattleRoom() {

        var monster =
            monsters[Math.floor(Math.random() * monsters.length)];

        game.enemy = {
            name: monster.name,
            hp: monster.hp,
            maxHp: monster.hp,
            attack: monster.attack,
            boss: false
        };

        game.turn = 0;
        game.heavyCooldown = 0;
        game.defending = false;

        renderCombat();
    }


    function renderCombat() {

        var room = document.getElementById('room');

        room.innerHTML = '';

        var title = document.createElement('div');
        title.className = 'room-title';
        title.textContent =
            game.enemy.boss ? '균열의 군주' : '전투';

        var description = document.createElement('div');
        description.className = 'room-description';
        description.textContent =
            '눈앞의 적을 쓰러뜨려라.';

        var enemy = document.createElement('div');
        enemy.className = 'combat-enemy';

        enemy.innerHTML =
            '<div class="enemy-name">' +
            escapeHtml(game.enemy.name) +
            '</div>' +
            '<div class="enemy-hp">HP ' +
            game.enemy.hp +
            ' / ' +
            game.enemy.maxHp +
            '</div>';

        var actions = document.createElement('div');
        actions.className = 'combat-actions';

        var attackButton =
            createButton('공격', function() {
                playerAttack();
            });

        var defenseButton =
            createButton('방어', function() {
                playerDefense();
            });

        var heavyButton =
            createButton(
                game.heavyCooldown > 0
                    ? '강타 (' + game.heavyCooldown + ')'
                    : '강타',
                function() {
                    heavyAttack();
                }
            );

        if (game.heavyCooldown > 0) {
            heavyButton.disabled = true;
        }

        actions.appendChild(attackButton);
        actions.appendChild(defenseButton);
        actions.appendChild(heavyButton);

        var log = document.createElement('div');
        log.id = 'combatLog';
        log.className = 'combat-log';

        log.textContent =
            '전투가 시작됐다.';

        room.appendChild(
            document.createElement('div')
        );

        room.appendChild(
            document.createTextNode('')
        );

        room.insertBefore(
            title,
            room.firstChild
        );

        room.appendChild(description);
        room.appendChild(enemy);
        room.appendChild(actions);
        room.appendChild(log);
    }


    function createButton(text, callback) {

        var button = document.createElement('button');

        button.className = 'choice';
        button.textContent = text;

        button.onclick = callback;

        return button;
    }


    function playerAttack() {

        if (game.actionLocked) {
            return;
        }

        game.actionLocked = true;

        var damage = game.attack;

        game.enemy.hp -= damage;

        addCombatLog(
            '당신의 공격! ' + damage + ' 피해.'
        );

        if (checkEnemyDead()) {
            return;
        }

        enemyTurn();
    }


    function heavyAttack() {

        if (game.actionLocked) {
            return;
        }

        if (game.heavyCooldown > 0) {
            return;
        }

        game.actionLocked = true;

        var damage = game.attack * 2;

        game.enemy.hp -= damage;

        game.heavyCooldown = 3;

        addCombatLog(
            '강타! ' + damage + ' 피해.'
        );

        if (checkEnemyDead()) {
            return;
        }

        enemyTurn();
    }


    function playerDefense() {

        if (game.actionLocked) {
            return;
        }

        game.actionLocked = true;

        game.defending = true;

        addCombatLog(
            '방어 자세를 취했다.'
        );

        enemyTurn();
    }

    function enemyTurn() {

        game.turn++;

        if (game.heavyCooldown > 0) {
            game.heavyCooldown--;
        }

        var damage = game.enemy.attack;

        if (
            game.enemy.boss &&
            game.turn % 3 === 0
        ) {
            damage *= 2;

            addCombatLog(
                '균열의 군주가 강력한 공격을 준비했다!'
            );
        }

        if (game.defending) {
            damage = Math.floor(damage * 0.5);

            game.defending = false;
        }

        damage = Math.max(
            1,
            damage - game.defense
        );

        game.hp -= damage;

        addCombatLog(
            game.enemy.name +
            '의 공격! ' +
            damage +
            ' 피해.'
        );

        updateStats();

        if (game.hp <= 0) {

            game.hp = 0;

            game.actionLocked = false;

            gameOver();

            return;
        }

        game.actionLocked = false;

        renderCombat();
    }


    function addCombatLog(text) {

        var log = document.getElementById('combatLog');

        if (!log) {
            return;
        }

        log.textContent += '\n' + text;

        log.scrollTop = log.scrollHeight;
    }


    function checkEnemyDead() {

        if (game.enemy.hp > 0) {

            renderCombat();

            return false;
        }

        if (game.enemy.boss) {

            completeGame();

            return true;
        }

        renderBattleReward();

        return true;
    }


    function renderBattleReward() {

        var room = document.getElementById('room');

        room.innerHTML =
            '<div class="room-number">BATTLE CLEAR</div>' +
            '<div class="room-title">전투 승리</div>' +
            '<div class="room-description">' +
            '보상을 선택하세요.' +
            '</div>';

        var choices = document.createElement('div');

        choices.className = 'choice-list';

        choices.appendChild(
            createButton(
                '공격력 +3',
                function() {
                    game.attack += 3;
                    nextRoom();
                }
            )
        );

        choices.appendChild(
            createButton(
                '최대 HP +10',
                function() {
                    game.maxHp += 10;
                    game.hp += 10;
                    nextRoom();
                }
            )
        );

        choices.appendChild(
            createButton(
                'HP +20',
                function() {
                    game.hp = Math.min(
                        game.maxHp,
                        game.hp + 20
                    );

                    nextRoom();
                }
            )
        );

        room.appendChild(choices);
    }


    /* ==========================================
       TREASURE
    ========================================== */

    function renderTreasureRoom() {

        var room = document.getElementById('room');

        room.innerHTML =
            '<div class="room-number">TREASURE</div>' +
            '<div class="room-title">보물 발견</div>' +
            '<div class="room-description">' +
            '하나를 선택하세요.' +
            '</div>';

        var choices = document.createElement('div');

        choices.className = 'choice-list';

        choices.appendChild(
            createButton(
                '공격력 +5',
                function() {
                    game.attack += 5;
                    nextRoom();
                }
            )
        );

        choices.appendChild(
            createButton(
                '방어력 +2',
                function() {
                    game.defense += 2;
                    nextRoom();
                }
            )
        );

        choices.appendChild(
            createButton(
                '최대 HP +20',
                function() {
                    game.maxHp += 20;
                    game.hp += 20;
                    nextRoom();
                }
            )
        );

        room.appendChild(choices);
    }


    /* ==========================================
       EVENT
    ========================================== */

    function renderEventRoom() {

        var room = document.getElementById('room');

        room.innerHTML =
            '<div class="room-number">EVENT</div>' +
            '<div class="room-title">수상한 제단</div>' +
            '<div class="room-description">' +
            '제단에서 무언가 속삭이고 있다.' +
            '</div>';

        var choices = document.createElement('div');

        choices.className = 'choice-list';

        choices.appendChild(
            createButton(
                '힘을 받아들인다 (ATK +8 / HP -10)',
                function() {

                    game.attack += 8;

                    game.hp = Math.max(
                        1,
                        game.hp - 10
                    );

                    nextRoom();
                }
            )
        );

        choices.appendChild(
            createButton(
                '지나간다',
                function() {
                    nextRoom();
                }
            )
        );

        room.appendChild(choices);
    }


    function nextRoom() {

        game.room++;

        updateStats();

        renderRoom();
    }


    /* ==========================================
       BOSS
    ========================================== */

    function startBoss() {

        game.enemy = {
            name: '균열의 군주',
            hp: 100,
            maxHp: 100,
            attack: 10,
            boss: true
        };

        game.turn = 0;
        game.heavyCooldown = 0;
        game.defending = false;

        renderCombat();
    }


    /* ==========================================
       COMPLETE
    ========================================== */

    async function completeGame() {

        stopTimer();

        try {

            var data = await api('/api/rift/complete', {
                method: 'POST',
                body: JSON.stringify({
                    startTime: game.serverStartTime
                })
            });

            document.getElementById('clearTime').textContent =
                formatTime(data.clearTime);

            var recordMessage =
                document.getElementById('recordMessage');

            if (data.isNewRecord) {
                recordMessage.classList.remove('hidden');
            } else {
                recordMessage.classList.add('hidden');
            }

            showScreen('clearScreen');

        } catch (error) {

            alert(
                '클리어 기록 저장 실패: ' +
                error.message
            );

            showScreen('mainScreen');
        }
    }


    function gameOver() {

        stopTimer();

        alert(
            '균열에서 쓰러졌다.\n\n기록은 저장되지 않습니다.'
        );

        showScreen('mainScreen');
    }


    /* ==========================================
       RANKING
    ========================================== */

    async function openRanking() {

        showScreen('rankingScreen');

        var list =
            document.getElementById('rankingList');

        list.innerHTML = '불러오는 중...';

        try {

            var data =
                await api('/api/rift/ranking');

            if (!data.ranking ||
                data.ranking.length === 0) {

                list.innerHTML =
                    '<div style="padding:20px;color:#777;">' +
                    '아직 기록이 없습니다.' +
                    '</div>';

                return;
            }

            list.innerHTML = '';

            data.ranking.forEach(function(item, index) {

                var row =
                    document.createElement('div');

                row.className = 'ranking-row';

                row.innerHTML =
                    '<div>' +
                    (index + 1) +
                    '</div>' +
                    '<div>' +
                    escapeHtml(item.username) +
                    '</div>' +
                    '<div class="ranking-time">' +
                    formatTime(Number(item.clear_time_ms)) +
                    '</div>';

                list.appendChild(row);
            });

        } catch (error) {

            list.innerHTML =
                '<div style="padding:20px;color:#777;">' +
                escapeHtml(error.message) +
                '</div>';
        }
    }


    /* ==========================================
       UI
    ========================================== */

    function updateStats() {

        document.getElementById('playerHp').textContent =
            game.hp + ' / ' + game.maxHp;

        document.getElementById('playerAttack').textContent =
            game.attack;

        document.getElementById('playerDefense').textContent =
            game.defense;

        document.getElementById('roomNumber').textContent =
            game.room + ' / 5';
    }


    function formatTime(ms) {

        ms = Math.max(0, Number(ms) || 0);

        var minutes =
            Math.floor(ms / 60000);

        var seconds =
            Math.floor((ms % 60000) / 1000);

        var milliseconds =
            ms % 1000;

        return (
            String(minutes).padStart(2, '0') +
            ':' +
            String(seconds).padStart(2, '0') +
            '.' +
            String(milliseconds).padStart(3, '0')
        );
    }


    function escapeHtml(value) {

        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }


    /* ==========================================
       INIT
    ========================================== */

    loadMe();

</script>

</body>
</html>
